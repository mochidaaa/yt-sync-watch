<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- GitHub Pagesではレスポンスヘッダを設定できないため、meta でCSPを宣言する。
     万一の注入に対する多層防御。読み込み先を増やす際はここも更新すること。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' https://img.youtube.com https://i.ytimg.com data:;
  font-src 'self';
  connect-src 'self' https://noembed.com https://*.peerjs.com wss://*.peerjs.com;
  frame-src https://www.youtube.com https://www.youtube-nocookie.com;
  base-uri 'none';
  form-action 'none'">
<title>YouTube SyncWatch</title>
<link rel="stylesheet" href="css/style.css?v=2.21">
<!-- PeerJS 1.5.4 を SRI(integrity) 付きで読み込む。
     CDNの改ざんやDNS乗っ取りが起きても、ハッシュ不一致ならブラウザが実行を拒否する。
     ハッシュは公式npmパッケージ peerjs-1.5.4.tgz の dist/peerjs.min.js (92,865バイト) から算出・検証済み。
     ライブラリを更新する際は integrity のハッシュも必ず更新すること。 -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"
        integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" defer></script>
<script src="js/app.js?v=2.21" defer></script>
</head>
<body>

<!-- ロビー画面 -->
<div id="lobby">
  <h1>▶ YouTube <span>SyncWatch</span> <span class="ver"></span></h1>
  <div class="card">
    <h2>新しいルームを作成</h2>
    <button id="btnCreate">ルームを作成する</button>
  </div>
  <div class="card">
    <h2 id="joinLabel">ルームに参加</h2>
    <input type="text" id="joinInput" placeholder="ルームID(例: ABC123)" maxlength="6"
           aria-labelledby="joinLabel" autocapitalize="characters"
           autocomplete="off" spellcheck="false">
    <button class="secondary" id="btnJoin">参加する</button>
  </div>
  <!-- 接続状況はスクリーンリーダーにも伝える -->
  <div id="lobbyStatus" role="status" aria-live="polite"></div>
</div>

<!-- メイン画面 -->
<div id="main">
  <div id="topbar">
    <h1 class="title" id="mainTitle" tabindex="-1">▶ YouTube <span>SyncWatch</span> <span class="ver"></span></h1>
    <button id="roomBadge" class="ghost" title="クリックでルームIDをコピー"
            aria-label="ルームIDをコピー"></button>
    <button id="btnInvite" class="ghost">招待リンクをコピー</button>
    <div id="peerCount" role="status" aria-live="polite"></div>
  </div>
  <div id="layout">
    <div id="playerWrap">
      <div id="playerBox">
        <div id="playerEmpty">再生リストに動画を追加してください</div>
        <div id="player"></div>
        <button id="btnUnmute" hidden>🔊 タップしてミュート解除</button>
      </div>
      <div id="nowBar">
        <div id="nowTitle"></div>
        <div id="controlsRow">
          <!-- 字幕機能(無効化・再利用のため保持): <button id="btnCC" class="ghost" title="全員の字幕表示を切り替えます">字幕: OFF</button> -->
          <button id="btnNext" title="次の動画を再生(全員に同期)" disabled>次の動画 <span class="chev" aria-hidden="true">»</span></button>
        </div>
      </div>
    </div>
    <div id="queuePanel">
      <h2 id="queueLabel">再生リスト(キュー)</h2>
      <div id="addRow">
        <input type="text" id="urlInput" placeholder="YouTube動画のURLを貼り付け"
               aria-label="YouTube動画のURL" autocomplete="off" spellcheck="false">
        <button id="btnAdd">追加</button>
      </div>
      <ul id="queueList" aria-labelledby="queueLabel"></ul>
      <div id="queueEmpty">キューは空です</div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
